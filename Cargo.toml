[package]
name = "bevy_procedural_audio"
authors = ["Gio Genre De Asis", "Bryan Maynard"]
version = "0.5.0"
edition = "2024"
description = "A Bevy plugin that integrates FunDSP into Bevy."
homepage = "https://github.com/bsgbryan/bevy_procedural_audio"
repository = "https://github.com/bsgbryan/bevy_procedural_audio"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "fundsp", "audio", "gamedev", "dsp"]
categories = ["game-development", "multimedia::audio"]

[features]
default = ["bevy_audio"]
kira = ["dep:kira", "bevy_kira_audio"]
bevy_audio = ["bevy/bevy_audio", "bevy/wav", "rodio"]
oddio = [] # bevy_oddio not compatible with Bevy 0.20; feature kept but disabled

[dependencies]
fundsp = "0.23"
cpal = "0.15"
once_cell = "1.13"
rodio = { version = "0.22", default-features = false, features = ["wav"], optional = true }
kira = { version = "0.12.1", default-features = false, features = ["wav"], optional = true }

[dependencies.uuid]
version = "1.1"
features = [
  "v5"
]

[dependencies.bevy]
# git = "https://github.com/bevyengine/bevy"
version = "0.20"
default-features = false
features = ["bevy_asset", "bevy_log"]

[dependencies.bevy_kira_audio]
# git = "https://github.com/NiklasEi/bevy_kira_audio.git"
# branch = "bevy_main"
version = "0.27.1"
default-features = false
features = ["wav"]
optional = true

# bevy_oddio has not been updated past Bevy 0.11 and is incompatible with Bevy 0.20.
# The `oddio` feature is disabled. Code is preserved for future use.
# [dependencies.bevy_oddio]
# version = "0.5"
# default-features = false
# optional = true
# features = ["wav"]

[dev-dependencies.bevy]
# git = "https://github.com/bevyengine/bevy"
version = "0.20"
default-features = false
features = [
  "bevy_audio",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_gltf",
  "bevy_render",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_animation",
  "bevy_winit",
  "bevy_gilrs",
  "png",
  "hdr",
  "x11",
  "wav"
]

[[example]]
name = "noise"
path = "examples/bevy_audio/noise.rs"
required-features = ["bevy_audio"]


[[example]]
name = "interactive"
path = "examples/bevy_audio/interactive.rs"
required-features = ["bevy_audio"]

[[example]]
name = "pitch"
path = "examples/bevy_audio/pitch.rs"
required-features = ["bevy_audio"]

[[example]]
name = "kira_noise"
path = "examples/kira/noise.rs"
required-features = ["kira"]


[[example]]
name = "kira_interactive"
path = "examples/kira/interactive.rs"
required-features = ["kira"]

[[example]]
name = "oddio_noise"
path = "examples/oddio/noise.rs"
required-features = ["oddio"]

[[example]]
name = "oddio_interactive"
path = "examples/oddio/interactive.rs"
required-features = ["oddio"]
